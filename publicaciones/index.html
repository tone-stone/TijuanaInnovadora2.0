<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Publicaciones de Redes Sociales | Tijuana Innovadora</title>
    <meta name="description"
        content="Síguenos en nuestras redes sociales y mantente actualizado con las iniciativas de Tijuana Innovadora." />
    <link rel="canonical" href="https://www.tijuanainnovadora.org/publicaciones/" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- SwiperJS -->
    <style>
        .swiper{overflow:hidden}
        .swiper-wrapper{display:flex;width:100%;height:100%}
        .swiper-slide{flex-shrink:0;width:100%;height:100%;position:relative}
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" media="print" onload="this.media='all'">
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="../../src/styles/fonts.css?v=20260612" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="../../src/styles/global.css?v=20260612" />
    <link rel="stylesheet" href="../../src/styles/social-carousel.css?v=20260612" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="../../src/styles/tailwind.css?v=20260612" />

    <style>
        /* Animaciones personalizadas */
        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-in {
            animation: slide-in 0.6s ease-out forwards;
        }

        /* Línea decorativa */
        .line-decoration {
            position: relative;
            display: inline-block;
        }

        .line-decoration::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-ti-azul) 0%, var(--color-tijuana-verde) 100%);
            border-radius: 2px;
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/png"
        href="https://res.cloudinary.com/dxxtlfbb4/image/upload/v1763997590/CabezaTI_wil1lj_owiwti.png" />

</head>

<body class="bg-white text-gray-900 font-sans">
    <main class="w-full">
        <!-- Sección de Publicaciones en Redes Sociales -->
        <section class="bg-gradient-to-br from-primary via-[#01426A]/80 to-[#C49E4F]/30 py-20 relative overflow-hidden" id="social-section">
            <div class="max-w-7xl mx-auto px-5 md:px-8">
                <!-- Header de la sección -->
                <div class="text-center mb-16 animate-slide-in" data-aos="fade-up" data-aos-duration="600">
                    <h2
                    class="text-3xl md:text-4xl text-center mb-4 tracking-tighter bg-gradient-to-r from-[#C49E4F] via-white to-[#005DAA] bg-clip-text text-transparent animate-gradient-x drop-shadow-2xl shadow-primary">
                    Siguenos en Redes Sociales
                </h2>
                <div
                    class="mx-auto mb-10 w-24 h-1 rounded-full bg-gradient-to-r from-[#C49E4F] via-[#005DAA] to-[#C49E4F] animate-pulse">
                </div>
                    <p class="text-center text-lg md:text-xl text-white/80 mb-8 font-light animate-fade-in-up duration-500">
                        Mantente conectado con nuestras iniciativas de arte, ciencia y tecnología. 
                        Descubre historias de innovación que transforman a Tijuana.
                    </p>
                </div>

                <!-- Carrusel de Publicaciones -->
                <div class="relative group" data-aos="fade-up" data-aos-duration="800" data-aos-delay="100">
                    <!-- Swiper Container -->
                    <div class="social-carousel swiper">
                        <div class="social-wrapper swiper-wrapper">
                            <!-- Las tarjetas se generan con JavaScript -->
                        </div>

                        <!-- Pagination -->
                        <div class="social-pagination swiper-pagination mt-8 relative z-10"></div>
                    </div>

                    <!-- Botones de Navegación -->
                    <div class="absolute -left-5 md:-left-16 top-1/2 transform -translate-y-1/2 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button class="social-prev swiper-button-prev
                                     w-12 h-12 bg-gradient-to-r from-blue-600 to-blue-700 
                                     text-white rounded-full shadow-lg hover:shadow-xl 
                                     transition-all duration-300 hover:scale-110
                                     flex items-center justify-center">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                    </div>

                    <div class="absolute -right-5 md:-right-16 top-1/2 transform -translate-y-1/2 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button class="social-next swiper-button-next
                                     w-12 h-12 bg-gradient-to-r from-blue-600 to-blue-700 
                                     text-white rounded-full shadow-lg hover:shadow-xl 
                                     transition-all duration-300 hover:scale-110
                                     flex items-center justify-center">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Enlace a redes sociales -->
                <div class="mt-16 text-center" data-aos="fade-up" data-aos-duration="800" data-aos-delay="200">
                    <p class="text-gray-600 mb-8 text-lg">Conecta con nosotros en nuestras redes sociales</p>
                    
                    <div class="flex justify-center gap-6 flex-wrap">
                        <a href="#" 
                           class="group/social inline-flex items-center justify-center w-16 h-16 rounded-full 
                                  bg-gradient-to-r from-pink-400 to-purple-500
                                  text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-110">
                            <i class="fab fa-instagram text-2xl group-hover/social:rotate-12 transition-transform"></i>
                            <span class="sr-only">Instagram</span>
                        </a>
                        
                        <a href="#" 
                           class="group/social inline-flex items-center justify-center w-16 h-16 rounded-full 
                                  bg-gradient-to-r from-blue-500 to-blue-700
                                  text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-110">
                            <i class="fab fa-facebook-f text-2xl group-hover/social:rotate-12 transition-transform"></i>
                            <span class="sr-only">Facebook</span>
                        </a>
                        
                        <a href="#" 
                           class="group/social inline-flex items-center justify-center w-16 h-16 rounded-full 
                                  bg-gradient-to-r from-red-800 to-orange-600
                                  text-white shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-110">
                            <i class="fab fa-youtube text-2xl group-hover/social:rotate-12 transition-transform"></i>
                            <span class="sr-only">YouTube</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../../src/javascript/aos.js?v=20260612"></script>
    <script src="../../src/javascript/social-carousel.js?v=20260612"></script>

    <script>
        // Inicializar AOS
        AOS.init({
            duration: 800,
            easing: "ease-in-out-cubic",
            once: true,
        });
    </script>

</body>

</html>
