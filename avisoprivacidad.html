*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    /*REMOVE IN PROD*/
    /* outline: 1px solid red; */
}
html,
body {
    height: 100%;
}
body {
    min-height: 100vh;
    font-family: "Quicksand", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #f4f4f4;
    scroll-behavior: smooth;
    color: #232323;
}

:root {
    --color-primary: #005daa;
    --color-accent: #c49e4f;
    --color-dark: #09090f;
    --color-bg: #f4f4f4;
    --color-highlight: #f7efe2;
    --color-arte-industria: #cd545b;
    --color-casa-ideas: #dc6b2f;
    --color-innovamoda: #93328e;
    --color-jovenes-lideres: #211551;
    --color-paseo-fama: #ffc72c;
    --color-sinfonica: #93272c;
    --color-tijuana-verde: #c4d600;
    --color-ti-azul: #01426a;
    --color-ti-dorado: #9a7611;
}

h1,
h2,
h3,
h4 {
    font-family: "Quicksand-Bold", sans-serif;
    font-weight: bold;
    line-height: 1.2;
}
h1 {
    font-size: 2.5rem;
    letter-spacing: -0.03em;
}

h2 {
    font-size: 1.55rem;
}

h3,
h4 {
    font-size: 1.25rem;
}

span,
p,
li {
    font-family: "Quicksand", sans-serif;
    line-height: 1.3;
    font-size: 1rem;
    letter-spacing: -0.01em;
}
button {
    font-family: "Quicksand-Medium", sans-serif;
    transition: transform 0.2s;
    font-size: 1rem !important;
    &:hover {
        cursor: pointer;
    }
}
a {
    font-family: "Quicksand-Medium", sans-serif;
    color: var(--color-primary);
    font-size: 1rem !important;
    text-decoration: none;
    transition: color 0.2s;
}

/* todas las imágenes tengan bordes redondeados y no se salgan de su contenedor */
img {
    width: 100%;
    display: block;
    object-fit: cover;
}

.fade-in {
    animation: fadeIn 1.2s ease forwards;
}
@keyframes fadeIn {
    0% {
        opacity: 0;
        transform: translateY(20px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

::-webkit-scrollbar {
    width: 8px;
    background: var(--color-bg);
}
::-webkit-scrollbar-thumb {
    background: var(--color-primary);
    border-radius: 5px;
}
::selection {
    background: var(--color-accent);
    color: #fff;
}

@keyframes marquee {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-50%);
    }
}

/* Animación para el SVG de olas */
@keyframes svgloop {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }
}

.animate-svgloop {
    animation: svgloop 18s linear infinite;
}

/* Gradiente animado (para texto, etc) */
@keyframes animate-gradient-x {
    0%,
    100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }
}

.animate-gradient-x {
    background-size: 200% 200%;
    animation: animate-gradient-x 5s ease-in-out infinite;
}

/* Fade-in hacia arriba */
@keyframes fade-in-up {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-fade-in-up {
    animation: fade-in-up 1.2s cubic-bezier(0.5, 0, 0.5, 1) both;
}

/* Rebote lento (botones) */
@keyframes bounce-slow {
    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

.animate-bounce-slow {
    animation: bounce-slow 2.4s infinite;
}

/* Wiggle (temblor breve, por ejemplo hashtags o decorativos) */
@keyframes wiggle {
    0%,
    100% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(2deg);
    }
}

.animate-wiggle {
    animation: wiggle 0.35s 2;
}

@layer utilities {
    .animate-float-slow {
        animation: float-slow 6s ease-in-out infinite;
    }

    @keyframes float-slow {
        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-10px);
        }
    }
}

@media screen and (min-width: 768px) {
    #events-grid {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }
}

@media screen and (min-width: 996px) {
    #events-grid {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 280px);
        grid-template-areas:
            "principal second third"
            "principal fourth fifth"
            "principal sixth sixth";

        & > div:nth-child(1) {
            grid-area: principal;
        }

        & > div:nth-child(2) {
            grid-area: second;
        }

        & > div:nth-child(3) {
            grid-area: third;
        }

        & > div:nth-child(4) {
            grid-area: fourth;
        }

        & > div:nth-child(5) {
            grid-area: fifth;
        }

        & > div:nth-child(6) {
            grid-area: sixth;
        }
    }
}

/* Banner Carousel Styles */
.banner-swiper {
    width: 100%;
    height: 100%;
}

.banner-swiper .swiper-pagination {
    bottom: 30px !important;
    z-index: 40;
}

.banner-swiper .swiper-pagination-bullet {
    width: 12px;
    height: 12px;
    background-color: rgba(255, 255, 255, 0.5) !important;
    opacity: 0.7;
    transition: all 0.3s ease;
}

.banner-swiper .swiper-pagination-bullet-active {
    background-color: rgba(247, 239, 226, 1) !important;
    width: 30px;
    border-radius: 6px;
    opacity: 1;
}

/* Mobile-friendly banner: show full images (contain) and avoid crop-heavy cover */
@media (max-width: 767px) {
    #banner-carousel,
    .banner-swiper,
    .banner-swiper .swiper-slide {
        min-height: 70vh;
        height: auto;
    }

    .banner-swiper .swiper-slide > div {
        background-size: contain !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
    }

    .banner-swiper .swiper-slide > div::before {
        content: "";
        /* preserve overlay same opacity when image has letterbox space */
    }
}
